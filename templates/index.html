<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Secure Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
        body {
            background-color: #1e1233;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .card {
            background: #ffffff;
            width: 380px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: none; /* Controlled via JS switching */
        }
        .card.active { display: block; }
        h2 { color: #8A2BE2; font-size: 24px; font-weight: bold; margin-bottom: 20px; text-align: center; }
        .subtitle { font-size: 12px; color: #777777; text-align: center; margin-bottom: 20px; line-height: 1.5; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: bold; color: #333333; margin-bottom: 6px; }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%; height: 40px; padding: 10px; border: 1px solid #cccccc; border-radius: 6px; font-size: 14px; outline: none;
        }
        input:focus { border-color: #8A2BE2; }
        .show-pass-container { display: flex; align-items: center; margin-top: 8px; font-size: 12px; color: #777777; }
        .show-pass-container input { margin-right: 6px; cursor: pointer; }
        .forgot-link { display: block; text-align: right; font-size: 12px; color: #a0a0a0; text-decoration: none; margin-top: -15px; margin-bottom: 20px; }
        .btn {
            width: 100%; height: 42px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.2s; outline: none;
        }
        .btn-primary { background: #8A2BE2; color: #ffffff; border: none; margin-top: 10px; }
        .btn-primary:hover { background: #7323BD; }
        .btn-outline { background: transparent; color: #8A2BE2; border: 1px solid #8A2BE2; }
        .btn-outline:hover { background: #f3ebff; }
        .divider { display: flex; align-items: center; text-align: center; margin: 20px 0; font-size: 11px; color: #a0a0a0; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #e0e0e0; }
        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }
        .switch-text { display: block; text-align: center; font-size: 12px; color: #8A2BE2; text-decoration: underline; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="login-card" class="card active">
        <h2>Log In</h2>
        <div class="input-group">
            <label>Your Email</label>
            <input type="email" id="login-email" placeholder="Enter your email">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="login-password" placeholder="Enter your password">
            <div class="show-pass-container">
                <input type="checkbox" onchange="togglePassword('login-password')"> Show Password
            </div>
        </div>
        <a href="#" class="forgot-link" onclick="switchScreen('forgot-card')">Forgot your password?</a>
        <button class="btn btn-primary" onclick="submitLogin()">Log In</button>
        <div class="divider">Don't have an account?</div>
        <button class="btn btn-outline" onclick="switchScreen('register-card')">Register</button>
    </div>

    <div id="register-card" class="card">
        <h2>Create Account</h2>
        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="reg-name" placeholder="Enter your name">
        </div>
        <div class="input-group">
            <label>Your Email</label>
            <input type="email" id="reg-email" placeholder="Enter your email">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="reg-password" placeholder="Create a password (min 6 chars)">
            <div class="show-pass-container">
                <input type="checkbox" onchange="togglePassword('reg-password')"> Show Password
            </div>
        </div>
        <button class="btn btn-primary" onclick="submitRegister()">Sign Up</button>
        <span class="switch-text" onclick="switchScreen('login-card')">Already have an account? Log In</span>
    </div>

    <div id="forgot-card" class="card">
        <h2>Reset Password</h2>
        <p class="subtitle">Enter your email address below and if it exists in our system, we'll send reset instructions.</p>
        <div class="input-group">
            <label>Your Email</label>
            <input type="email" id="forgot-email" placeholder="Enter your registered email">
        </div>
        <button class="btn btn-primary" onclick="alert('Reset instructions sent if email exists.')">Send Reset Link</button>
        <span class="switch-text" style="color: #a0a0a0;" onclick="switchScreen('login-card')">Back to Log In</span>
    </div>

    <script>
        function switchScreen(cardId) {
            document.querySelectorAll('.card').forEach(card => card.classList.remove('active'));
            document.querySelectorAll('input').forEach(input => { input.value = ''; input.type = input.id.includes('password') ? 'password' : input.type; });
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
            document.getElementById(cardId).classList.add('active');
        }

        function togglePassword(id) {
            const el = document.getElementById(id);
            el.type = el.type === 'password' ? 'text' : 'password';
        }

        async function submitLogin() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            alert(data.message);
        }

        async function submitRegister() {
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            });
            const data = await res.json();
            alert(data.message);
            if(data.success) switchScreen('login-card');
        }
    </script>
</body>
</html>
